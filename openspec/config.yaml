schema: spec-driven
context: |
  Repository: SamuelAsherRivello/rmc-colyseus-multiplayer-server.
  TypeScript Colyseus server entry is a thin Vercel adapter. Implement game
  rooms in multiplayer-server/src, browser-safe shared simulation/client
  modules in multiplayer-server/packages/client, and tests in
  multiplayer-server/test. Keep game protocols isolated and preserve existing
  room keys, client APIs, release asset names, and deployments.
  Use Node 24 and npm. Required checks: npm ci, npm run typecheck, npm test.
  Room state in the checked-in server is currently process-local and does not
  satisfy the active standardize-private-room-flow Vercel hosting requirement.
  Treat that change's user-authored specs as the target: prove cross-instance
  room ownership, ordered state recovery, socket renewal, and free-quota use
  before marking hosting complete or releasing the migration. Use Vercel
  Hobby and no paid host or datastore tier for this change. Preserve current
  production behavior until the release gate passes. The new fighter game
  requires private, two-seat rooms and bounded server-authoritative input with
  15-second same-seat recovery. Do not create PRs unless requested.
rules:
  proposal:
    - State behavior changes and acceptance criteria clearly.
    - Preserve existing client and room compatibility.
  design:
    - Match current Colyseus room and browser-safe simulation architecture.
  tasks:
    - Include focused integration and existing-game regression checks.
