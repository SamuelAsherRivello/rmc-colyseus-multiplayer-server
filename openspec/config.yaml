schema: spec-driven
context: |
  Repository: SamuelAsherRivello/rmc-colyseus-multiplayer-server.
  TypeScript Colyseus server entry is a thin Vercel adapter. Implement game
  rooms in multiplayer-server/src, browser-safe shared simulation/client
  modules in multiplayer-server/packages/client, and tests in
  multiplayer-server/test. Keep game protocols isolated and preserve existing
  room keys, client APIs, release asset names, and deployments.
  Use Node 24 and npm. Required checks: npm ci, npm run typecheck, npm test.
  Room state is in-memory on Vercel Hobby and may be interrupted or split
  across instances; do not promise durable state or guaranteed global room
  routing. The new fighter game requires private, two-seat rooms and bounded
  server-authoritative input with 15-second same-seat recovery.
  Release the shared client and backend together through the checked-in
  Release workflow; the workflow requires Vercel token/org/project secrets and
  deploys after publishing its tagged client tarball. Do not create PRs unless
  requested.
rules:
  proposal:
    - State behavior changes and acceptance criteria clearly.
    - Preserve existing client and room compatibility.
  design:
    - Match current Colyseus room and browser-safe simulation architecture.
  tasks:
    - Include focused integration and existing-game regression checks.
