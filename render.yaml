services:
  - type: web
    name: rmc-colyseus-multiplayer-server
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    numInstances: 1
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 300
    envVars:
      - key: NODE_ENV
        value: production
