name: Verify deployment access
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vercel-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check configured credentials
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo "::error::VERCEL_TOKEN is missing"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "::error::VERCEL_ORG_ID is missing"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::VERCEL_PROJECT_ID is missing"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - name: Verify Vercel account
        run: npx --yes vercel@60.1.3 whoami
      - name: Deploy current feasibility server
        run: npx --yes vercel@60.1.3 deploy --prod --yes --scope ashers-projects-d3be6036
      - name: Two-client live check
        run: npm run probe
        env:
          SERVER_URL: https://rmc-colyseus-multiplayer-server.vercel.app

