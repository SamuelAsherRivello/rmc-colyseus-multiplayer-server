name: Deploy backend release
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
    secrets:
      RENDER_DEPLOY_HOOK_URL:
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag at the current main commit (for example v0.9.8)
        required: true
permissions:
  contents: read
concurrency:
  group: render-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require the selected source to be the current main commit
        run: |
          git fetch origin main --no-tags --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Verify Render configuration and current health
        run: node scripts/check-credentials.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Trigger Render deployment
        run: curl --fail --silent --show-error --output /dev/null "$RENDER_DEPLOY_HOOK_URL"
      - name: Verify public health endpoint serves the selected release
        run: |
          node --input-type=module <<'NODE'
          import metadata from './package.json' with { type: 'json' };
          const base = process.env.RENDER_SERVICE_URL.replace(/\/$/, '');
          for (let attempt = 0; attempt < 60; attempt++) {
            try {
              const response = await fetch(`${base}/api/health?verify=${Date.now()}`, { signal: AbortSignal.timeout(10000) });
              const health = await response.json();
              if (response.ok && health.status === 'ok' && health.version === metadata.version) {
                console.log('Public Render service verified:', health.version, health.games);
                process.exit(0);
              }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error('Render service did not serve the selected release');
          NODE
      - name: Verify every registered game against the public service
        run: npm test
        env:
          SERVER_URL: ${{ vars.RENDER_SERVICE_URL }}
      - name: Verify a session stays connected beyond five minutes
        run: npm run verify:long-session
        env:
          SERVER_URL: ${{ vars.RENDER_SERVICE_URL }}
          LONG_SESSION_SECONDS: '360'





