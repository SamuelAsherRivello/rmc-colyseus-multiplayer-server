name: Deploy backend release
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Release commit or tag at the current main commit
        required: true
permissions:
  contents: read
concurrency:
  group: vercel-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require the selected source to be the current main commit
        run: |
          git fetch origin main --no-tags --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Stage the selected source with production settings
        id: deploy
        run: |
          npm install --global vercel@62.2.0
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          deployment_url="$(vercel deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Verify the staged deployment serves the selected version
        env:
          SERVER_URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/verify-release-health.mjs
      - name: Verify every registered game against the staged deployment
        run: npm test
        env:
          SERVER_URL: ${{ steps.deploy.outputs.url }}
      - name: Verify a Vercel Hobby-compatible four-minute relay session
        run: npm run verify:long-session
        env:
          SERVER_URL: ${{ steps.deploy.outputs.url }}
          LONG_SESSION_SECONDS: '240'
      - name: Verify the four-minute Space Invaders session and host migration
        run: node scripts/space-invaders-session.mjs
        env:
          SERVER_URL: ${{ steps.deploy.outputs.url }}
          LONG_SESSION_SECONDS: '240'
      - name: Promote the verified deployment to the stable production URL
        id: promote
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: vercel promote "$DEPLOYMENT_URL" --yes --token="$VERCEL_TOKEN"
      - name: Verify the stable production URL serves the selected version
        env:
          SERVER_URL: https://rmc-colyseus-multiplayer-server.vercel.app
        run: node scripts/verify-release-health.mjs
      - name: Verify two clients relay through the stable production URL
        env:
          SERVER_URL: https://rmc-colyseus-multiplayer-server.vercel.app
        run: npm run probe
      - name: Restore the previous production deployment if public verification fails
        if: ${{ failure() && steps.promote.outcome == 'success' }}
        run: vercel rollback --token="$VERCEL_TOKEN"
