name: Deploy backend release
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag at the current main commit (for example v0.9.8)
        required: true
permissions:
  contents: read
concurrency:
  group: vercel-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require the selected source to be the current main commit
        run: |
          git fetch origin main --no-tags --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build and deploy the tagged source to Vercel production
        id: deploy
        run: |
          npm install --global vercel@62.2.0
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          deployment_url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Verify public health endpoint serves the selected release
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          node --input-type=module <<'NODE'
          import metadata from './package.json' with { type: 'json' };
          const base = process.env.DEPLOYMENT_URL.replace(/\/$/, '');
          for (let attempt = 0; attempt < 60; attempt++) {
            try {
              const response = await fetch(`${base}/api/health?verify=${Date.now()}`, { signal: AbortSignal.timeout(10000) });
              const health = await response.json();
              if (response.ok && health.status === 'ok' && health.version === metadata.version) {
                console.log('Public Vercel service verified:', health.version, health.games);
                process.exit(0);
              }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error('Vercel service did not serve the selected release');
          NODE
      - name: Verify every registered game against the public service
        run: npm test
        env:
          SERVER_URL: ${{ steps.deploy.outputs.url }}
      - name: Verify a Vercel Hobby-compatible relay session
        run: npm run verify:long-session
        env:
          SERVER_URL: ${{ steps.deploy.outputs.url }}
          LONG_SESSION_SECONDS: '240'





